# Render blueprint: the API on the free web plan. The database is external (Neon's free Postgres) because a
# Render workspace gets only one free database. Render dashboard -> New -> Blueprint -> pick this repository;
# values marked sync: false are asked for once.
services:
  - type: web
    name: fun-travels-tour-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS eu-central-1), so each query stays inside Frankfurt.
    region: frankfurt
    branch: main
    healthCheckPath: /api/v1/tours/catalog
    envVars:
      # The database connection string, e.g. postgresql://user:password@host/dbname?sslmode=require
      # (Neon: Dashboard -> Connect). docker-entrypoint.sh turns it into a JDBC URL with user and password.
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Behind Render's proxy: read the client address from X-Forwarded-For (rate limiting) and https from the proto.
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: native
      # The web app's address on Vercel, e.g. https://fun-travels-tour.vercel.app (used in password-reset links).
      - key: CLIENT_URL
        sync: false
      # Allowed browser origins, comma separated; set to the Vercel address once it exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Development accounts (one per role) on an empty database. Render generates the shared password;
      # read it under the service's Environment tab.
      - key: SEED_ENABLED
        value: "true"
      - key: SEED_PASSWORD
        generateValue: true
